<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRS Food — Good Food • Great Mood</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080706;--card:#15110a;--ink:#f6ecd2;--mut:#b9a878;--acc:#e7b531;--tur:#ffd76a;--leaf:#3f9b3a;--line:#5c4613;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:Cinzel,Georgia,sans-serif;line-height:1.05;margin:0}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1100px;margin:auto;flex-wrap:wrap}
.logo{font-size:24px;font-weight:800;color:var(--tur)}.logo b{color:var(--acc)}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav a{padding:6px 12px;border-radius:99px;white-space:nowrap;font-weight:500}nav a.on{background:var(--ink);color:var(--bg)}
@media(max-width:700px){nav{order:3;flex-basis:100%}}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 20px;font:700 15px Figtree,sans-serif;cursor:pointer;display:inline-block;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #0002}.btn:active{transform:translateY(1px)}
.btn.sm{padding:8px 14px}.btn.alt{background:var(--tur);color:#1a2118}.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}.btn.wa{background:#1fa855}
:focus-visible{outline:3px solid var(--tur);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:20px 16px 100px}
.hero{background:radial-gradient(circle at 100% 100%,#ff6a1f 0,#e8352b 16%,transparent 52%),radial-gradient(circle at 0 0,#5cc8ff55,transparent 48%),linear-gradient(160deg,#16205a,#0a0f24);border:1px solid var(--line);color:#fff;border-radius:28px;padding:44px 26px 36px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(2.6rem,10vw,5.6rem);font-weight:800;letter-spacing:-.02em;max-width:11ch;background:linear-gradient(90deg,#fff,#bfe6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:44ch;font-size:18px;opacity:.92}
.hero .em{position:absolute;right:-10px;bottom:-30px;font-size:min(46vw,260px);opacity:.95;animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-8deg) translateY(-8px)}}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.strip{background:linear-gradient(90deg,var(--acc),#ff9a1f);color:#fff;border-radius:14px;margin:14px 0;overflow:hidden;white-space:nowrap;font:800 18px Cinzel,sans-serif;padding:10px 0}
.strip span{display:inline-block;padding-left:100%;animation:mq 28s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
h2{font-size:clamp(1.7rem,5vw,2.4rem);margin:34px 0 14px;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .25s}.card:hover{transform:translateY(-4px)}
.ph{height:150px;display:grid;place-items:center;font-size:64px;background:linear-gradient(135deg,#ff9a1f,#e8352b 55%,#2a3fc9) center/cover;position:relative}
.tag{position:absolute;top:10px;left:10px;font:700 12px Figtree;background:var(--card);color:var(--acc);padding:3px 9px;border-radius:99px}
.cb{padding:14px}.cb h3{font-size:20px}.mut{color:var(--mut);font-size:14px;margin:.3em 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.offer{border:2px dashed var(--acc);border-radius:16px;padding:16px}.offer b{font:800 20px Cinzel}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.chip{padding:7px 15px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:500}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:4px 0 12px}
label{font-weight:500;font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.line:last-child{border:0}
.q{display:flex;align-items:center;gap:8px}.q button{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:16px}
.steps{display:flex;margin:22px 0}.st{flex:1;text-align:center;font-size:13px;color:var(--mut)}
.st i{display:block;width:34px;height:34px;border-radius:50%;background:var(--line);margin:0 auto 6px;line-height:34px;font-style:normal}
.st.d{color:var(--ink)}.st.d i{background:var(--leaf)}.st.c i{background:var(--acc);animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 9px #e0301e33}}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;flex-direction:column;gap:8px}
.fab a{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;box-shadow:0 4px 14px #0004;background:#1fa855;color:#fff}.fab a+a{background:var(--tur)}
#t{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:20}#t.on{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--line);padding:24px 16px;text-align:center;color:var(--mut);font-size:14px}
table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.th{width:46px;height:46px;border-radius:10px;background:var(--tur) center/cover;display:grid;place-items:center;font-size:24px}
.card:hover{border-color:var(--acc);box-shadow:0 12px 34px #ff4d2e33}.open{display:inline-block;padding:5px 14px;border-radius:99px;background:#ffffff1f;margin-bottom:16px;font-weight:500;font-size:14px}.open.on{color:#7dffb0}

if(t.id=='zone'){S.zone=t.value;save()}
if(t.id=='pay')$('#cardf').style.display=t.value=='card'?'':'none';
if(t.id=='img'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);pend=c.toDataURL('image/jpeg',.8);toast('Photo ready. Save the meal to apply.')};im.src=fr.result};fr.readAsDataURL(t.files[0])}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f)),id=f.id;
if(id=='pr'){const c=v.c.trim().toUpperCase();if(c==''||c==S.cfg.pc){S.promo=c;save();toast(c?'Code applied':'Code removed');render(1)}else toast('That code is not valid')}
if(id=='reg'&&API){try{const j=await api('POST','/register',{n:v.n,e:v.e,p:v.p});S.tok=j.token;S.users=[j.user];S.me=j.user.e;save();toast('Welcome!');go(next||'account');next=null}catch(x){toast(x.message)}return}
if(id=='reg'){const em=v.e.trim().toLowerCase();if(S.users.some(u=>u.e==em))return toast('Email already registered');S.users.push({n:v.n.trim(),e:em,h:await hash(em+v.p)});S.me=em;save();toast('Welcome!');go(next||'account');next=null}
if(id=='login'&&API){try{const j=await api('POST','/login',{e:v.e,p:v.p});S.tok=j.token;S.users=[j.user];S.me=j.user.e;S.orders=await api('GET','/orders',0,S.tok);save();go(next||'account');next=null}catch(x){toast(x.message)}return}
if(id=='login'){const em=v.e.trim().toLowerCase(),u=S.users.find(x=>x.e==em);if(!u||u.h!=await hash(em+v.p))return toast('Wrong email or password');S.me=em;save();go(next||'account');next=null}
if(id=='co'&&API){if(v.pay=='card'&&(v.cn.replace(/\s/g,'').length<13||!/^\d\d\/\d\d$/.test(v.ex)||v.cv.length<3))return toast('Check your card details');try{const o=await api('POST','/orders',{items:items().map(x=>({id:x.m.id,q:x.q})),zone:S.zone,addr:v.a,ph:v.ph,nm:v.n,pay:v.pay,promo:S.promo},S.tok);S.orders.unshift(o);S.cart={};S.promo='';save();toast('Order placed!');go('track/'+o.id)}catch(x){toast(x.message)}return}
if(id=='co'){const T=tot();if(v.pay=='card'&&(v.cn.replace(/\s/g,'').length<13||!/^\d\d\/\d\d$/.test(v.ex)||v.cv.length<3))return toast('Check your card details');
const o={id:'RS'+Math.floor(1000+Math.random()*9000),u:S.me,items:items().map(x=>({n:x.m.n,q:x.q})),t0:Date.now(),tot:T.t,addr:v.a,pay:v.pay};S.orders.unshift(o);S.cart={};S.promo='';save();toast('Order placed!');go('track/'+o.id)}
if(id=='rv'&&API){try{S.reviews.unshift(await api('POST','/reviews',{m:v.m,r:+v.r,t:v.t},S.tok));toast('Review posted');render(1)}catch(x){toast(x.message)}return}
if(id=='rv'){S.reviews.unshift({m:v.m,n:user().n,r:+v.r,t:v.t});save();toast('Review posted');render(1)}
if(id=='adl'&&API){try{const j=await api('POST','/admin/login',{passcode:v.p});ATOK=j.token;adm=true;render(1)}catch(x){toast(x.message)}return}
if(id=='adl'){if(await hash('pc:'+v.p)==(S.cfg.ph||await hash('pc:admin123'))){adm=true;render(1)}else toast('Wrong passcode')}
if(id=='nf'){const o=S.news.find(x=>x.id==nedit);if(o)Object.assign(o,{t:v.t,b:v.b,p:v.p?1:0});else S.news.push({id:Date.now(),t:v.t,b:v.b,p:v.p?1:0});nedit=null;save();toast('Saved');render(1)}
if(id=='of'){S.offers=v.o.split('\n').map(l=>l.split('|')).filter(a=>a[0].trim()).map(a=>({t:a[0].trim(),d:(a[1]||'').trim()}));save();toast('Offers saved');render(1)}
if(id=='sf'){const c=S.cfg;Object.assign(c,{name:v.name.trim()||'My Restaurant',tag:v.tag,sub:v.sub,phone:v.phone,tel:v.tel.replace(/[^\d+]/g,''),wa:v.wa.replace(/\D/g,''),addr:v.addr,fo:+v.fo||0,pc:v.pc.trim().toUpperCase(),pp:+v.pp||0});
const z={};v.z.split('\n').forEach(l=>{const[a,b]=l.split(':');if(a&&a.trim())z[a.trim()]=+b||0});c.z=Object.keys(z).length?z:{'Pick up':0};
c.hr=[0,1,2,3,4,5,6].map(i=>v['x'+i]?null:[v['o'+i]||'10:30',v['e'+i]||'19:00']);if(v.np){c.ph=await hash('pc:'+v.np);NP=v.np}if(!(S.zone in c.z))S.zone=Object.keys(c.z)[0];save();toast('Settings saved');render(1)}
if(id=='mf'){const old=S.meals.find(x=>x.id==edit),m={id:edit||'m'+Date.now(),n:v.n,d:v.d,p:+v.p,c:v.c,e:v.e||'🍽️',f:v.f?1:0,s:v.s?1:0,img:v.rm?undefined:(pend||(old&&old.img))};
if(old)S.meals[S.meals.indexOf(old)]=m;else S.meals.push(m);edit=null;pend=null;save();toast('Saved');render(1)}});
(async()=>{try{const j=await api('GET','/state');Object.assign(S,{meals:j.meals,news:j.news,offers:j.offers,reviews:j.reviews});S.cfg=Object.assign({},CFG,j.cfg);API=true;
if(S.tok){try{const u=await api('GET','/me',0,S.tok);S.me=u.e;S.users=[u];S.orders=await api('GET','/orders',0,S.tok)}catch(e){S.tok=null;S.me=null}}else S.me=null}catch(e){}render()})();
</script></body></html>
